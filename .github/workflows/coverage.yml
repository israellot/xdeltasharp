name: Coverage

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/release-dotnet
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x # Runtime for net8.0 tests and package consumers
      - name: Check release SDK
        run: test "$(dotnet --version)" = "$(jq -r .sdk.version global.json)"
      - run: dotnet build XDeltaSharp.sln -c Release
      - run: dotnet format whitespace XDeltaSharp.sln --no-restore --verify-no-changes
      - name: Verify NuGet packages and run their examples
        run: python3 eng/test-packages.py
      - name: Test allocation counts without instrumentation
        run: >-
          dotnet test tests/XDeltaSharp.Tests/XDeltaSharp.Tests.csproj -c Release --no-build
          --filter 'Category=Allocation' -- xUnit.ParallelizeTestCollections=false
      - name: Decode encoder output with the xdelta3 CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y xdelta3
          XDELTA3=xdelta3 dotnet test tests/XDeltaSharp.Tests/XDeltaSharp.Tests.csproj -c Release --no-build --filter 'Category=Interop'
      - name: Measure library coverage
        run: >-
          dotnet test tests/XDeltaSharp.Tests/XDeltaSharp.Tests.csproj -c Release --no-build
          --filter 'Category!=Allocation'
          --settings tests/XDeltaSharp.Tests/coverage.runsettings --results-directory coverage
      - name: Generate HTML and badges
        run: |
          dotnet tool install dotnet-reportgenerator-globaltool --version 5.6.0 --tool-path "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/reportgenerator" '-reports:coverage/**/coverage.cobertura.xml' '-targetdir:coverage-report' '-reporttypes:Html;Badges'
          sed 's/>coverage</>lines</g' coverage-report/badge_shieldsio_linecoverage_blue.svg > coverage-report/lines.svg
          sed 's/>coverage</>branches</g' coverage-report/badge_shieldsio_branchcoverage_blue.svg > coverage-report/branches.svg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage-report/
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x # Runtime for net8.0 tests and package consumers
      - run: dotnet test XDeltaSharp.sln -c Debug -- xUnit.ParallelizeTestCollections=false

  update-badges:
    needs: coverage
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-report
          path: coverage-report
      - name: Refresh README badges if coverage changed
        run: |
          cp coverage-report/{lines,branches}.svg .github/badges/
          git add .github/badges/{lines,branches}.svg
          if git diff --cached --quiet; then exit 0; fi
          git fetch origin master
          if [ "$(git rev-parse origin/master)" != "$GITHUB_SHA" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh coverage badges'
          git push origin HEAD:master
