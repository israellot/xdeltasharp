name: README benchmarks

on:
  workflow_dispatch:
  push:
    branches: [codex/readme-benchmarks]
    paths:
      - .github/workflows/benchmarks.yml
      - benchmarks/XDeltaSharp.Benchmarks/**

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      DOTNET_TieredCompilation: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: israellot/DeltaSharp
          ref: c66944b54f3cf58b4157c2b0ea366275dbea7d31
          path: corpus
          sparse-checkout: src/Benchmarks/Data
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/benchmark-dotnet
        with:
          global-json-file: global.json
      - name: Record hardware and runtime
        run: |
          mkdir results
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sysctl -n machdep.cpu.brand_string
            sw_vers
          else
            lscpu
            cat /etc/os-release
          fi > results/host.txt
          uname -m >> results/host.txt
          dotnet --info >> results/host.txt
          cat results/host.txt
      - name: Benchmark the two editions of Moby-Dick
        run: |
          project=benchmarks/XDeltaSharp.Benchmarks
          data=corpus/src/Benchmarks/Data
          dotnet build "$project" -c Release
          dotnet run --no-build -c Release --project "$project" -- --levels "$data/pg15.txt" "$data/pg2701.txt" | tee results/encode.csv
          dotnet run --no-build -c Release --project "$project" -- --decode-file "$data/pg15.txt" "$data/pg2701.txt" | tee results/decode.csv
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moby-dick-${{ matrix.runner }}
          path: results/
          if-no-files-found: error
